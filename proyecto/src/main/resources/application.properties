spring.application.name=proyecto

# ==========================================
# CONFIGURACIÓN DE CONEXIÓN A MYSQL
# ==========================================

# Esta es la URL de tu base de datos.
# jdbc:mysql:// -> Protocolo.
# localhost:3306 -> Dónde está tu BD (tu máquina local, en el puerto por defecto 3306).
# /levelupgamer -> ¡El nombre de tu base de datos!
spring.datasource.url=jdbc:mysql://localhost:3306/levelupgamer

# Tu usuario de MySQL. 'root' es común en desarrollo, pero usa el que tengas.
spring.datasource.username=root

# Tu contraseña de MySQL.
spring.datasource.password=

# ==========================================
# CONFIGURACIÓN DE HIBERNATE (EL MOTOR DE JPA)
# ==========================================

# Esta es la línea MÁS IMPORTANTE para el desarrollo.
# 'update' le dice a Hibernate: "Mira mis clases @Entity (Product, Review)
# y compáralas con la base de datos. Si las tablas no existen, créalas.
# Si falta una columna, agrégala."
#
# Opciones comunes:
# - none: No hacer nada (para producción).
# - validate: Validar que las tablas coincidan (para producción).
# - update: Actualizar el esquema (para desarrollo).
# - create: Borra todo y crea las tablas de nuevo CADA VEZ que arrancas (útil para tests).
spring.jpa.hibernate.ddl-auto=update

# (Opcional) Esto es para que puedas ver el SQL que Hibernate
# genera automáticamente. Es MUY útil para depurar.
spring.jpa.show-sql=true

# (Opcional) Hace que el SQL de arriba se vea más bonito y legible.
spring.jpa.properties.hibernate.format_sql=true
server.port = 8081
jwt.secret=mi-clave-secreta-muy-larga-y-dificil-de-adivinar-1234567890

# ... (tu configuración de BD y jwt.secret) ...

# 1. Define la ruta absoluta a tu carpeta de subidas
# (¡¡OJO!! Usa 'forward slashes' /)
# Reemplaza 'C:/Users/gabri/Downloads/proyecto/proyecto' con la ruta REAL a tu proyecto
file.upload-dir=C:/Users/gabri/Downloads/proyecto/proyecto/Uploads

